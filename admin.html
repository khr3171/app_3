<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 · 규정사전</title><link rel="stylesheet" href="./admin.css"></head><body>
<header><a href="./"><img src="./assets/logo.png" alt="부산광역시사회서비스원"> 규정사전</a><span>관리자</span></header>
<main><section id="login-panel" class="panel"><h1>관리자 로그인</h1><p>승인된 Google 계정으로 건의사항과 개정 자료를 관리합니다.</p><button id="login" disabled>Google 계정으로 로그인</button></section>
<p id="status" role="status" aria-live="polite">로그인 설정 확인 중…</p>
<div id="workspace" hidden><div class="toolbar"><p id="account"></p><button id="logout" class="secondary">로그아웃</button></div>
<nav aria-label="관리 메뉴"><button id="show-suggestions" aria-pressed="true">건의사항</button><button id="show-revisions" aria-pressed="false">개정 자료 관리</button></nav>
<section id="suggestions-panel" class="panel"><div class="toolbar"><h1>접수된 건의사항</h1><button id="refresh" class="secondary">새로고침</button></div><p>항목을 누르면 작성자와 건의 내용을 확인할 수 있습니다.</p><div id="suggestions"></div><button id="more" hidden>다음 목록</button></section>
<section id="revisions-panel" class="panel" hidden><h1>개정 자료 업로드</h1><p>전체 개정본을 등록하고 기존 자료를 교체하세요. 한글(HWP) 파일은 PDF로 저장한 후 올려주세요.</p>
<form id="upload-form"><label>자료명<input name="name" required maxlength="180"></label><div class="grid"><label>시행일<input name="effectiveDate" type="date" required></label><label>분류<select name="kind"><option value="internal">내부규정</option><option value="guideline">법령·지침</option><option value="manual">업무 매뉴얼</option></select></label><label>예산 기준연도<select name="year"><option value="">연도 구분 없음</option><option>2026</option><option>2027</option></select></label><label>교체할 자료<select name="target" id="target"><option value="new">새 자료 추가</option></select></label></div>
<label>개정 원문 (PDF 또는 UTF-8 TXT, 최대 20MB)<input name="file" type="file" accept=".pdf,.txt" required></label><button type="submit" id="extract">본문 추출·미리보기</button></form>
<div id="preview" hidden><h2>추출 내용 확인</h2><p id="extract-info"></p><label>페이지<select id="page-select"></select></label><pre id="page-text"></pre><p>표의 금액과 조·항 번호가 원문과 일치하는지 확인하세요. 이미지 PDF는 OCR 처리 후 업로드해야 합니다.</p><label class="check"><input id="publish-consent" type="checkbox"> 추출 내용을 검토했으며 이 원문과 본문을 누구나 검색·열람하도록 공개합니다. 기존 자료를 교체하면 이전 본문은 검색에서 제외됩니다.</label><button id="publish">검색에 공개 반영</button></div>
<h2>등록 이력</h2><div id="revisions"></div></section></div></main><script type="module" src="./admin.js"></script></body></html>
